[package]
name = "akasabi"
version = "0.1.0"
edition = "2021"
description = "A tool for searching Japanese text"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
etcetera = "0.8.0"
flate2 = "1.0"
itertools = "0.14"
# Lindera 1.4.1 with embedded IPADIC dictionary
# Note: The embedded-ipadic feature requires network access during build to download
# the IPADIC dictionary files. If build fails with dictionary download errors,
# ensure network access is available or use an alternative dictionary loading method.
lindera = { version = "1.4.1", features = ["embedded-ipadic"] }
lindera-ipadic = { version = "1.4.1", features = ["embedded-ipadic"] }
lindera-tantivy = "1.1.1"
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
tantivy = "0.25"
toml = { version = "0.8" }
wana_kana = "4.0"
xml = "0.8"
yansi = "1.0"
time = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["process"] }

[dev-dependencies]
tempfile = "3.13"
